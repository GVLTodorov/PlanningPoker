name: Demo Video

# Manual only: this drives 5 real browsers against a live instance and needs a real Giphy API key
# (GIPHY_API_BASE_URL/GIPHY_API_QUERY secrets) to show real gifs, so it isn't cheap or safe to run
# on every push/PR the way ci.yml's jobs are. Trigger it on-demand from the Actions tab whenever
# the UI changes enough to be worth a fresh demo.
on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build PlanningPoker.slnx -c Release

      # `dotnet build`'s output only serves static files (index.html, the Blazor framework files,
      # css/js) via a manifest pointing back to source-tree intermediate paths -- fine for
      # `dotnet run`, but running that DLL directly (as this job does) 404s on every static asset.
      # `dotnet publish` bundles a real, portable wwwroot, same as the Dockerfile already does for
      # the production image.
      - name: Publish the app
        run: dotnet publish src/PlanningPoker.Api/PlanningPoker.Api.csproj -c Release -o publish/api

      - name: Install Playwright's Chromium
        run: pwsh src/PlanningPoker.Tests.Play/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start the app
        env:
          ASPNETCORE_URLS: http://localhost:5232
          GIPHY_API_BASE_URL: ${{ secrets.GIPHY_API_BASE_URL }}
          GIPHY_API_QUERY: ${{ secrets.GIPHY_API_QUERY }}
        run: |
          # ContentRootPath defaults to the process's working directory (the repo root here), not
          # the published DLL's own folder, so WebRootPath resolves to <repo root>/wwwroot (doesn't
          # exist) unless --contentRoot is given explicitly. It must be absolute: a relative value
          # gets resolved against the DLL's base directory, not this shell's cwd, and silently
          # doubles the path (confirmed locally: publish/api/publish/api).
          dotnet publish/api/PlanningPoker.Api.dll --contentRoot "$GITHUB_WORKSPACE/publish/api" > api.log 2>&1 &
          echo $! > api.pid
          timeout 30 bash -c 'until curl -sf http://localhost:5232/healthz >/dev/null; do sleep 1; done'

      - name: Record demo
        id: record
        run: |
          mkdir -p artifacts/demo-video
          dotnet run --project src/PlanningPoker.Tests.Play -c Release --no-build -- \
            http://localhost:5232 artifacts/demo-video | tee artifacts/demo-video.log
          video_path=$(grep -oP '(?<=^VIDEO_PATH=).+' artifacts/demo-video.log)
          echo "webm_path=$video_path" >> "$GITHUB_OUTPUT"

      - name: Show app server log
        if: always()
        run: cat api.log || true

      - name: Stop the app
        if: always()
        run: kill "$(cat api.pid)" || true

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # GitHub's README sanitizer strips raw <video> tags entirely (verified: fetched this repo's
      # own rendered README HTML via the API and the tag was gone, no trace) -- an mp4 can't be
      # embedded inline that way. A GIF renders everywhere markdown images do, so that's the
      # actual embed; the two-pass palette filter keeps a 24s/800px clip to a few MB instead of the
      # tens of MB a naive conversion produces.
      - name: Convert to GIF
        run: |
          mkdir -p docs
          ffmpeg -y -i "${{ steps.record.outputs.webm_path }}" \
            -vf "fps=12,scale=800:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" \
            docs/demo.gif

      - name: Commit updated demo GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          if git diff --cached --quiet; then
            echo "Demo GIF unchanged, nothing to commit."
          else
            git commit -m "chore: refresh demo gif"
            git push
          fi
