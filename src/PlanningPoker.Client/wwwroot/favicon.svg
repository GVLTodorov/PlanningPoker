<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Planning Poker icon">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bff09b"/>
      <stop offset="45%" stop-color="#3fae5c"/>
      <stop offset="100%" stop-color="#0d3f20"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eafbea"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0d3f20" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="176" y="166" width="150" height="204" rx="20"
          fill="url(#card)" stroke="#1b7a3d" stroke-width="4"
          transform="rotate(-16 256 256)"/>
    <rect x="186" y="166" width="150" height="204" rx="20"
          fill="url(#card)" stroke="#1b7a3d" stroke-width="4"
          transform="rotate(16 256 256)"/>
    <rect x="181" y="154" width="150" height="204" rx="20"
          fill="url(#card)" stroke="#145c2e" stroke-width="5"/>
  </g>

  <text x="211" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700"
        fill="#1b7a3d">8</text>
  <text x="256" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="104" font-weight="800"
        fill="#1b7a3d" text-anchor="middle">8</text>
</svg>
